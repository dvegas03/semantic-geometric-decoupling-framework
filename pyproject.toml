[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-geometric-decoupling-framework"
version = "0.1.0"
description = "Semantic-Geometric Decoupling Framework for robust depth estimation and spatial reasoning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Danila Kharitonenkov" },
    { name = "Vuthea Chheang" },
]
requires-python = ">=3.11"
keywords = ["depth-estimation", "point-cloud", "3d-reconstruction", "computer-vision", "spatial-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core runtime dependencies — kept minimal so the geometry pipeline
# can run without optional visualization or VLM packages.
dependencies = [
    "torch>=2.0",
    "open3d>=0.17",
    "numpy>=1.24",
    "opencv-python>=4.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Visualization (Plotly + scikit-learn for PCA colour mapping)
viz = [
    "plotly>=5.14",
    "scikit-learn>=1.3",
]

# VLM inference — heavy; only needed when plugging in Qwen-VL
vlm = [
    "transformers>=4.45",   # Qwen2-VL support landed in 4.45
    "accelerate>=0.30",
    "qwen-vl-utils>=0.0.8",
    "Pillow>=9.5",
    "torchvision>=0.15",
]

# LangGraph orchestration layer (Phase 0 agent)
agent = [
    "langgraph>=0.2",
]

# Training stack (Phase P onward; declared here so the surface is reviewed once)
train = [
    "peft>=0.11",
    "datasets>=2.19",
    "wandb>=0.17",
    "webdataset>=0.2",
    "pyyaml>=6.0",
]

# Poster / QR-code generation tool
tools = [
    "qrcode[pil]>=7.4",
    "Pillow>=9.5",
]

# Development + testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

# Install everything for CI (train stays out — CI does not train)
all = [
    "engine-grounder[viz,vlm,agent,tools,dev]",
]

[project.urls]
Homepage = "https://github.com/dvegas03/semantic-geometric-decoupling-framework"
Repository = "https://github.com/dvegas03/semantic-geometric-decoupling-framework"
Issues = "https://github.com/dvegas03/semantic-geometric-decoupling-framework/issues"

# ── Hatch build config ────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["engine_grounder"]

# ── Ruff linter / formatter ───────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
    "SIM108", # use ternary instead of if-else (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests
"examples/*" = ["T201"] # allow print() in example scripts
"benchmarks/*" = ["T201"]
"tools/*" = ["T201"]
# Inherited from the robust-depth-estimator fork — burn down before Phase 2.
"engine_grounder/spatial/visualizer.py" = ["C408", "UP006", "UP045"]
"engine_grounder/pipeline.py" = ["C408", "UP006", "UP035"]
"benchmarks/run_benchmarks.py" = ["C408", "E402"]
"examples/render_split_viz.py" = ["C408", "UP006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy type checking ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # Open3D stubs not always available

[[tool.mypy.overrides]]
module = [
    "engine_grounder.pipeline",
    "engine_grounder.geometry.depth_filter",
    "engine_grounder.perception.shape_encoder",
]
# Fork debt (WS4 burn-down); do not add new modules here.
disable_error_code = ["arg-type", "assignment", "no-any-return"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
